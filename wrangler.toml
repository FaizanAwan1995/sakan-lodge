name = "sakan-lodge"
main = "src/worker.js"
keep_vars = true
compatibility_date = "2026-10-13"

routes = [
  "https://sakanlodge.com/*"
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

# Dedicated storage for Gmail OAuth state and encrypted refresh token.
[[kv_namespaces]]
binding = "GMAIL_TOKEN_STORE"
id = "1561e031bea149a4a9e4efe340058d8b"

[[durable_objects.bindings]]
name = "GMAIL_OAUTH_STATE"
class_name = "GmailOAuthState"

[[migrations]]
tag = "gmail-oauth-state-v1"
new_sqlite_classes = ["GmailOAuthState"]

# Preview-specific Gmail OAuth storage; never share production tokens.
[[previews.kv_namespaces]]
binding = "GMAIL_TOKEN_STORE"
id = "0bd63cd09f324424970ab520394c20f0"

# Automatically isolated Durable Object storage for each preview.
[[previews.durable_objects.bindings]]
name = "GMAIL_OAUTH_STATE"
class_name = "GmailOAuthState"

[vars]
RENT_INVOICE_EMAILS_ENABLED = "true"

[triggers]
crons = ["* * * * *"]

[previews.vars]
RENT_INVOICE_EMAILS_ENABLED = "false"
